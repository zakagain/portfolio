<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3dffa0" />
    <link rel="canonical" href="https://zak.is-a.dev/" />

    <!-- Structured data for search engines. Kept static so it is present in the
         initial HTML even for crawlers that do not run JavaScript. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Zakariya Khalid",
        "url": "https://zak.is-a.dev/",
        "jobTitle": "Chief Operating Officer, Orca Systems",
        "worksFor": {
          "@type": "Organization",
          "name": "Orca Systems",
          "url": "https://orcaservers.com/"
        },
        "description": "Portfolio of Zakariya Khalid, a software engineer building things for the web.",
        "email": "mailto:hello@zakariyakhalid.com",
        "sameAs": ["https://github.com/zakagain"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Zakariya Khalid",
        "url": "https://zak.is-a.dev/",
        "description": "Portfolio of Zakariya Khalid, a software engineer building things for the web.",
        "inLanguage": "en"
      }
    </script>

    <title>Zakariya Khalid — COO, Orca Systems</title>
    <meta
      name="description"
      content="Portfolio of Zakariya Khalid, a software engineer building things for the web."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zak.is-a.dev/" />
    <meta property="og:title" content="Zakariya Khalid — COO, Orca Systems" />
    <meta
      property="og:description"
      content="Portfolio of Zakariya Khalid, a software engineer building things for the web."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://zak.is-a.dev/og.png" />
    <meta name="twitter:image" content="https://zak.is-a.dev/og.png" />

    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      // Follows the OS preference unless the visitor has used the toggle.
      // Keep this in sync with readInitialTheme() in src/hooks/useTheme.ts.
      try {
        var stored = localStorage.getItem('theme')
        if (stored !== 'light' && stored !== 'dark') {
          stored = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = stored
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }

      // GitHub Pages routes unknown paths to 404.html, which redirects here
      // with the requested path in ?redirect=. Restore the clean URL so the
      // router sees /work rather than /. The path is absolute, so this works
      // unchanged at a root domain or under /repo/.
      try {
        var params = new URLSearchParams(location.search)
        var redirect = params.get('redirect')

        if (redirect && /^\/(?!\/)/.test(redirect)) {
          params.delete('redirect')
          var rest = params.toString()
          history.replaceState(
            null,
            '',
            redirect + (rest ? '?' + rest : '') + location.hash,
          )
        }
      } catch (error) {
        /* Nothing to restore. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
